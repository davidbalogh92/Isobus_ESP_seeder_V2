; Vetőgép ISOBUS vezérlő – ESP32-S3
;   waveshare_8di8ro  – Waveshare ESP32-S3-ETH-8DI-8RO-C (16 MB flash, CAN GPIO17/18, 8 bemenet, 8 relé, Ethernet)
[platformio]
default_envs = waveshare_8di8ro

[env:waveshare_8di8ro]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf
; rögzített AgIsoStack++ verzió (ugyanez a host/CMakeLists.txt-ben)
lib_deps = https://github.com/Open-Agriculture/AgIsoStack-plus-plus.git#3e37ba629b53b565fa80c63feaed027a9156d3b9

board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_upload.maximum_size = 7340032
board_build.flash_mode = dio
board_build.partitions = partitions_16mb.csv
; a generált VT object pool és a webes felület a firmware-be ágyazva
board_build.embed_files = generated/object_pool.iop
board_build.embed_txtfiles = web/index.html

build_flags =
  -Wno-error=missing-field-initializers
  -DSEEDER_FW_VERSION=\"2.2.0\"

build_type = release
upload_protocol = esptool
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

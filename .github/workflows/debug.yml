name: Debug RAM (ideiglenes)
on:
  push:
    branches: [debug-backtrace]
jobs:
  ram:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        rev: [32ace1c, HEAD]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout ${{ matrix.rev }} -- . && git log --oneline -1 ${{ matrix.rev }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'platformio==6.1.18' esp-idf-size
      - run: python -m platformio run -e rcv17_16mb > build.log 2>&1 || (tail -50 build.log; exit 1)
      - run: |
          MAP=$(find .pio/build/rcv17_16mb -maxdepth 1 -name "*.map" | head -1); echo "map: $MAP"
          python -m esp_idf_size "$MAP" || true
          SZ=$(find ~/.platformio/packages -name "xtensa-esp32s3-elf-size" | head -1)
          $SZ -A .pio/build/rcv17_16mb/firmware.elf | grep -E "dram0|iram0|flash|rtc" || true
          grep -E "DATA_CACHE|WIFI_IRAM|RX_IRAM|STATIC_RX_BUFFER_NUM" .pio/build/rcv17_16mb/config/sdkconfig.h || true
